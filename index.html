<style>
/* ========== 主题变量（暖木手账风） ========== */
:root {
  --paper: hsl(38, 40%, 97%);
  --paper-deep: hsl(36, 38%, 94%);
  --wood: hsl(28, 85%, 55%);
  --wood-light: hsl(28, 90%, 93%);
  --wood-lighter: hsl(30, 95%, 96%);
  --wood-dark: hsl(28, 68%, 42%);
  --ink: hsl(24, 14%, 24%);
  --ink-soft: hsl(26, 10%, 44%);
  --ink-faint: hsl(28, 10%, 62%);
  --amber: hsl(35, 90%, 58%);
  --terracotta: hsl(8, 75%, 55%);
  --moss: hsl(145, 45%, 52%);
  --white: #ffffff;
  --radius: 14px;
  --radius-lg: 18px;
  --shadow-card: 0 1px 2px hsla(28,30%,70%,.18), 0 4px 14px hsla(28,30%,60%,.10);
  --shadow-hover: 0 2px 6px hsla(28,30%,60%,.22), 0 10px 24px hsla(28,30%,50%,.14);
  --shadow-fab: 0 4px 14px hsla(28,70%,45%,.38);
  --font-title: "LXGW WenKai", "Kaiti SC", "STKaiti", KaiTi, "楷体", serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  background-image: radial-gradient(hsla(28,60%,82%,.10) 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}

/* ========== 布局 ========== */
.app { max-width: 48rem; margin: 0 auto; padding: 0 1rem 6rem; }

/* ========== 头部 ========== */
.header { display: flex; align-items: center; justify-content: space-between; padding-top: 1.5rem; }
.header-left { display: flex; align-items: center; gap: .625rem; }
.logo {
  width: 2.75rem; height: 2.75rem; border-radius: 50%;
  background: var(--wood-lighter); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px hsla(28,60%,55%,.2);
  overflow: hidden;
}
.logo svg { width: 2.25rem; height: 2.25rem; }
.header h1 { font-family: var(--font-title); font-size: 1.5rem; font-weight: 700; line-height: 1; }
.header p { font-size: .75rem; color: var(--ink-faint); margin-top: .25rem; }
.header-actions { display: flex; gap: .5rem; }
.icon-btn {
  width: 2.25rem; height: 2.25rem; border-radius: 12px; border: 1px solid hsla(28,85%,55%,.25);
  background: rgba(255,255,255,.7); color: var(--ink-soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.icon-btn:hover { background: var(--wood-lighter); color: var(--ink); }
.icon-btn svg { width: 1rem; height: 1rem; }

/* ========== 搜索框 ========== */
.search-wrap { margin-top: 1.5rem; }
.search-box {
  display: flex; align-items: center; gap: .5rem;
  width: 100%; border-radius: 16px; background: rgba(255,255,255,.9);
  border: 2px solid transparent; box-shadow: var(--shadow-card);
  padding: .625rem 1rem; transition: all .2s;
}
.search-box:focus-within { border-color: hsla(28,85%,55%,.6); }
.search-box svg { width: 1.25rem; height: 1.25rem; color: var(--wood-dark); flex-shrink: 0; }
.search-box input {
  flex: 1; border: none; background: transparent; font-size: 1rem; color: var(--ink);
  font-family: var(--font-body); outline: none; height: 2.25rem;
}
.search-box input::placeholder { color: var(--ink-faint); }
.search-clear {
  border: none; background: transparent; cursor: pointer; color: var(--ink-faint);
  padding: .25rem; border-radius: 50%; display: flex;
}
.search-clear:hover { background: var(--wood-lighter); color: var(--ink); }

/* ========== 统计卡 ========== */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .625rem; margin-top: 1rem; }
.stat-card {
  background: var(--white); border-radius: var(--radius); padding: .75rem;
  box-shadow: var(--shadow-card); cursor: pointer; transition: all .15s;
  position: relative; overflow: hidden;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-card.active { outline: 2px solid hsla(28,85%,55%,.5); }
.stat-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; border-radius: 10px; margin-bottom: .5rem;
}
.stat-icon svg { width: 1.1rem; height: 1.1rem; }
.stat-value { font-size: 1.5rem; font-weight: 800; line-height: 1; }
.stat-label { font-size: .6875rem; color: var(--ink-soft); margin-top: .25rem; font-weight: 500; }

/* ========== 分类标签 ========== */
.tabs-wrap { margin-top: 1.25rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabs-wrap::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: .5rem; padding: .25rem 0; align-items: center; }
.tab {
  flex-shrink: 0; border-radius: 999px; padding: .375rem .875rem;
  font-size: .875rem; font-weight: 600; cursor: pointer; border: none;
  background: rgba(255,255,255,.8); color: var(--ink-soft); transition: all .15s;
  display: inline-flex; align-items: center; gap: .25rem;
}
.tab:hover { background: var(--wood-lighter); color: var(--ink); }
.tab.active { background: var(--wood); color: #fff; box-shadow: var(--shadow-fab); }
.tab .count { font-size: .75rem; font-weight: 700; opacity: .85; }
.tab-manage {
  flex-shrink: 0; border-radius: 999px; padding: .375rem .75rem;
  font-size: .75rem; font-weight: 600; cursor: pointer;
  border: 1px dashed hsla(28,85%,55%,.4); background: transparent; color: var(--wood-dark);
  transition: all .15s;
}
.tab-manage:hover { background: var(--wood-lighter); }

/* ========== 物品网格 ========== */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: 1rem; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.item-card {
  background: var(--white); border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-card); cursor: pointer; transition: all .2s;
  display: flex; flex-direction: column; border: none; text-align: left;
  font-family: var(--font-body);
}
.item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.item-img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--wood-lighter);
  display: flex; align-items: center; justify-content: center; position: relative;
}
.item-img .placeholder { font-family: var(--font-title); font-size: 1.5rem; color: hsla(28,85%,55%,.45); }
.item-badge { position: absolute; top: .5rem; right: .5rem; }
.item-body { padding: .75rem; display: flex; flex-direction: column; gap: .375rem; flex: 1; }
.item-name { font-family: var(--font-title); font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-loc { display: flex; align-items: center; gap: .25rem; font-size: .8125rem; font-weight: 600; color: var(--wood-dark); }
.item-loc svg { width: .875rem; height: .875rem; flex-shrink: 0; }
.item-loc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: .25rem; }
.item-cat { border-radius: 999px; background: var(--wood-lighter); padding: .125rem .5rem; font-size: .6875rem; font-weight: 500; color: var(--ink-soft); }
.item-date { font-size: .6875rem; color: var(--ink-faint); }

/* ========== 状态标签 ========== */
.badge {
  display: inline-flex; align-items: center; gap: .25rem;
  border-radius: 999px; padding: .125rem .5rem; font-size: .6875rem; font-weight: 700;
  backdrop-filter: blur(4px);
}
.badge .dot { width: .375rem; height: .375rem; border-radius: 50%; }
.badge svg { width: .875rem; height: .875rem; }
.badge-permanent { background: hsla(24,14%,24%,.08); color: var(--ink-soft); }
.badge-permanent .dot { background: var(--ink-faint); }
.badge-valid { background: hsla(145,45%,52%,.12); color: var(--moss); }
.badge-valid .dot { background: var(--moss); }
.badge-expiring { background: hsla(35,90%,58%,.15); color: var(--amber); }
.badge-expiring .dot { background: var(--amber); }
.badge-expired { background: hsla(8,75%,55%,.12); color: var(--terracotta); }
.badge-expired .dot { background: var(--terracotta); }

/* ========== FAB ========== */
.fab {
  position: fixed; bottom: 1.5rem; right: 1.25rem;
  width: 3.5rem; height: 3.5rem; border-radius: 50%; border: none;
  background: var(--wood); color: #fff; box-shadow: var(--shadow-fab);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform .15s; z-index: 50;
}
.fab:active { transform: scale(.95); }
.fab svg { width: 1.75rem; height: 1.75rem; }
@media (min-width: 768px) {
  .fab { right: max(1.25rem, calc(50% - 30rem)); }
}

/* ========== 空态 ========== */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: 4rem 0; text-align: center; }
.empty-icon { width: 4rem; height: 4rem; border-radius: 24px; background: var(--wood-lighter); display: flex; align-items: center; justify-content: center; color: hsla(28,85%,55%,.5); }
.empty-icon svg { width: 2rem; height: 2rem; }
.empty h3 { font-family: var(--font-title); font-size: 1.125rem; font-weight: 700; color: var(--ink-soft); }
.empty p { font-size: .875rem; color: var(--ink-faint); max-width: 14rem; }

/* ========== 加载骨架 ========== */
.skeleton { background: linear-gradient(90deg, var(--wood-lighter) 25%, var(--paper-deep) 50%, var(--wood-lighter) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-lg); aspect-ratio: 3/4; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ========== 弹窗 ========== */
.modal-overlay {
  position: fixed; inset: 0; background: hsla(24,14%,24%,.25); backdrop-filter: blur(2px);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 1rem; animation: fadeIn .18s ease-out;
}
.modal {
  background: var(--white); border-radius: 20px; padding: 1.5rem;
  width: 100%; max-width: 28rem; max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-hover); animation: popIn .16s ease-out;
  position: relative;
}
.modal-close {
  position: absolute; top: 1rem; right: 1rem; border: none; background: transparent;
  cursor: pointer; color: var(--ink-faint); padding: .25rem; border-radius: 50%;
  display: flex; transition: all .15s;
}
.modal-close:hover { background: var(--wood-lighter); color: var(--ink); }
.modal-close svg { width: 1rem; height: 1rem; }
.modal h2 { font-family: var(--font-title); font-size: 1.25rem; font-weight: 700; margin-bottom: .25rem; }
.modal .desc { font-size: .875rem; color: var(--ink-soft); margin-bottom: 1.25rem; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

/* ========== 表单 ========== */
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .375rem; color: var(--ink); }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; border-radius: 12px; border: 1px solid hsla(28,85%,55%,.25);
  background: rgba(255,255,255,.8); padding: .625rem .875rem; font-size: .875rem;
  color: var(--ink); font-family: var(--font-body); outline: none; transition: all .15s;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: hsla(28,85%,55%,.6); box-shadow: 0 0 0 3px hsla(28,85%,55%,.15);
}
.form-group textarea { resize: vertical; min-height: 5rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.form-error { color: var(--terracotta); font-size: .75rem; margin-top: .25rem; }
.form-hint { color: var(--ink-faint); font-size: .6875rem; margin-top: .25rem; }

/* 图片上传 */
.img-upload {
  width: 100%; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden;
  border: 2px dashed hsla(28,85%,55%,.35); background: hsla(30,95%,96%,.6);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .5rem; cursor: pointer; transition: all .15s; position: relative;
}
.img-upload:hover { border-color: hsla(28,85%,55%,.6); background: var(--wood-lighter); }
.img-upload svg { width: 1.5rem; height: 1.5rem; color: var(--wood-dark); }
.img-upload span { font-size: .75rem; font-weight: 600; color: var(--wood-dark); }
.img-upload small { font-size: .6875rem; color: var(--ink-faint); }
.img-upload img { width: 100%; height: 100%; object-fit: cover; }
.img-remove {
  position: absolute; top: .5rem; right: .5rem; border: none;
  background: hsla(24,14%,24%,.45); color: #fff; border-radius: 50%;
  width: 1.75rem; height: 1.75rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center; backdrop-filter: blur(4px);
  transition: background .15s;
}
.img-remove:hover { background: var(--terracotta); }
.img-remove svg { width: 1rem; height: 1rem; color: #fff; }

/* ========== 按钮 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  border-radius: 12px; padding: .625rem 1rem; font-size: .875rem; font-weight: 600;
  cursor: pointer; border: none; transition: all .15s; font-family: var(--font-body);
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--wood); color: #fff; box-shadow: var(--shadow-fab); }
.btn-primary:hover { background: var(--wood-dark); }
.btn-secondary { background: var(--wood-light); color: var(--wood-dark); }
.btn-secondary:hover { background: hsla(28,85%,55%,.25); }
.btn-outline { background: rgba(255,255,255,.7); color: var(--ink); border: 1px solid hsla(28,85%,55%,.4); }
.btn-outline:hover { background: var(--wood-lighter); }
.btn-danger { background: hsla(8,75%,55%,.9); color: #fff; }
.btn-danger:hover { background: var(--terracotta); }
.btn-sm { padding: .375rem .75rem; font-size: .75rem; border-radius: 10px; }
.btn-group { display: flex; gap: .75rem; margin-top: 1.5rem; justify-content: flex-end; }
.btn-group .btn { flex: 1; }

/* ========== 详情页 ========== */
.detail-back {
  display: inline-flex; align-items: center; gap: .25rem; margin-top: 1.25rem;
  font-size: .875rem; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  border: none; background: transparent; transition: color .15s;
}
.detail-back:hover { color: var(--ink); }
.detail-back svg { width: 1rem; height: 1rem; }

.detail-img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: var(--radius-lg);
  margin-top: 1rem; background: var(--wood-lighter);
}

.detail-loc {
  display: flex; align-items: flex-start; gap: .75rem; background: var(--white);
  border-radius: var(--radius-lg); padding: 1rem; box-shadow: var(--shadow-card); margin-top: 1.25rem;
}
.detail-loc svg { width: 1.25rem; height: 1.25rem; color: var(--wood-dark); flex-shrink: 0; margin-top: .125rem; }
.detail-loc-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
.detail-loc-value { font-family: var(--font-title); font-size: 1.5rem; font-weight: 700; color: var(--wood-dark); line-height: 1.2; margin-top: .125rem; }

.detail-body { margin-top: 1.25rem; }
.detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
.detail-title { font-family: var(--font-title); font-size: 1.875rem; font-weight: 700; line-height: 1.1; }
.detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .75rem; font-size: .875rem; color: var(--ink-soft); }
.detail-cat { border-radius: 999px; background: var(--wood-lighter); padding: .125rem .625rem; font-weight: 500; }
.detail-date { display: flex; align-items: center; gap: .25rem; color: var(--ink-faint); font-size: .8125rem; }
.detail-date svg { width: .875rem; height: .875rem; }

.detail-note {
  background: rgba(255,255,255,.7); border-radius: 12px; padding: 1rem; margin-top: 1rem;
  box-shadow: 0 1px 2px hsla(28,30%,70%,.1);
}
.detail-note-label { font-size: .75rem; font-weight: 600; color: var(--ink-faint); margin-bottom: .375rem; }
.detail-note-text { font-size: .875rem; line-height: 1.6; white-space: pre-wrap; color: var(--ink); }

.detail-shares { background: rgba(255,255,255,.7); border-radius: 12px; padding: 1rem; margin-top: .75rem; }
.detail-shares-label { font-size: .75rem; font-weight: 600; color: var(--ink-faint); margin-bottom: .5rem; }
.detail-share-list { display: flex; flex-wrap: wrap; gap: .5rem; }
.detail-share-item { border-radius: 999px; background: var(--wood-lighter); padding: .25rem .625rem; font-size: .75rem; font-weight: 500; color: var(--ink); }

.detail-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
.detail-actions .btn { flex: 1; }

/* ========== 分类管理 ========== */
.cat-list { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.cat-chip {
  display: inline-flex; align-items: center; gap: .375rem; border-radius: 999px;
  background: var(--wood-lighter); padding: .375rem .75rem; font-size: .875rem; font-weight: 500;
}
.cat-chip .count { font-size: .75rem; font-weight: 700; color: var(--ink-faint); }
.cat-chip .preset { font-size: .625rem; background: hsla(28,85%,55%,.15); color: var(--wood-dark); border-radius: 999px; padding: 0 .375rem; }
.cat-add-row { display: flex; gap: .5rem; border-top: 1px dashed hsla(28,85%,55%,.3); padding-top: 1rem; }
.cat-add-row input { flex: 1; }

/* ========== Toast ========== */
.toast-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: .5rem; width: calc(100% - 2.5rem); max-width: 20rem; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: .5rem; background: rgba(255,255,255,.95);
  border-radius: 12px; padding: .75rem 1rem; font-size: .875rem; font-weight: 500;
  box-shadow: var(--shadow-hover); animation: popIn .16s ease-out; color: var(--ink);
}
.toast svg { width: 1rem; height: 1rem; flex-shrink: 0; }
.toast-success svg { color: var(--moss); }
.toast-error svg { color: var(--terracotta); }
.toast-info svg { color: var(--wood-dark); }

/* ========== 隐藏文件输入 ========== */
.hidden-input { display: none; }
</style>

<body>

<div class="app" id="app"></div>

<!-- 隐藏的文件输入（图片上传 / JSON 导入） -->
<input type="file" id="img-input" accept="image/*" class="hidden-input">
<input type="file" id="json-input" accept=".json,application/json" class="hidden-input">

<script>
/* ================================================================
   「东西呢」· 单文件版
   - localStorage 本地存储
   - 零依赖，纯原生 JS
   ================================================================ */

// ========== 工具函数 ==========
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);

// Asia/Shanghai 业务日
function todayShanghai() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const pick = (t) => parts.find(p => p.type === t)?.value ?? '';
  return `${pick('year')}-${pick('month')}-${pick('day')}`;
}
function daysBetween(a, b) {
  const [ay, am, ad] = a.split('-').map(Number);
  const [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
function computeExpireStatus(expireDate) {
  if (!expireDate) return 'permanent';
  const today = todayShanghai();
  if (expireDate < today) return 'expired';
  return daysBetween(today, expireDate) <= 30 ? 'expiring' : 'valid';
}
function formatDate(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// ========== 状态管理 ==========
const STORAGE_KEY = 'my-stuff-app-v1';
const PRESET_CATEGORIES = ['证件票据', '电子产品', '药品健康', '衣物配饰', '厨房餐具', '工具维修', '美妆个护', '其他'];

let state = {
  categories: [],
  items: [],
  view: 'home', // 'home' | 'detail'
  detailId: null,
  search: '',
  activeCategory: null,
  expireFilter: null,
  modal: null, // 'form' | 'categories' | null
  editingItem: null,
  formImage: null,
  submitting: false,
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.categories = parsed.categories || [];
      state.items = parsed.items || [];
    }
  } catch (e) { console.warn('加载数据失败', e); }
  // 首次访问初始化预置分类
  if (state.categories.length === 0) {
    state.categories = PRESET_CATEGORIES.map(name => ({ id: uid(), name, isPreset: true }));
    saveState();
  }
}
let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories: state.categories, items: state.items }));
    } catch (e) {
      toast('error', '保存失败：存储空间可能已满（图片过多）');
    }
  }, 200);
}

// ========== Toast ==========
function toast(type, message) {
  let container = $('.toast-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const iconName = type === 'success' ? 'checkCircle' : type === 'error' ? 'xCircle' : 'clock';
  el.innerHTML = `${icons[iconName]}<span>${message}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2400);
}

// ========== 渲染 ==========
function render() {
  const app = $('#app');
  if (state.view === 'detail') {
    app.innerHTML = renderDetail();
  } else {
    app.innerHTML = renderHome();
  }
  bindEvents();
}

function filteredItems() {
  let list = [...state.items];
  if (state.search) {
    const kw = state.search.toLowerCase();
    list = list.filter(i =>
      i.name.toLowerCase().includes(kw) ||
      i.location.toLowerCase().includes(kw) ||
      (i.note && i.note.toLowerCase().includes(kw))
    );
  }
  if (state.activeCategory) {
    list = list.filter(i => i.categoryId === state.activeCategory);
  }
  if (state.expireFilter) {
    list = list.filter(i => computeExpireStatus(i.expireDate) === state.expireFilter);
  }
  // 创建时间降序
  list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  return list;
}

function categoryItemCount(catId) {
  return state.items.filter(i => i.categoryId === catId).length;
}

    <div class="tabs-wrap">
      <div class="tabs">

function renderItemCard(item) {
  const cat = state.categories.find(c => c.id === item.categoryId);
  const status = computeExpireStatus(item.expireDate);
  return `
    <button class="item-card" data-item="${item.id}">
      <div class="item-img">
        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" loading="lazy">` : `<span class="placeholder">${item.name.charAt(0)}</span>`}
        <span class="item-badge">${renderBadge(status)}</span>
      </div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-loc">${icons.mapPin}<span>${item.location}</span></div>
        <div class="item-meta">
          <span class="item-cat">${cat ? cat.name : '未分类'}</span>
          ${item.expireDate ? `<span class="item-date">${item.expireDate}</span>` : ''}
        </div>
      </div>
    </button>
  `;
}

function renderBadge(status) {
  const map = {
    permanent: { label: '长期有效', icon: 'infinity' },
    valid: { label: '有效', icon: 'checkCircle' },
    expiring: { label: '即将到期', icon: 'clock' },
    expired: { label: '已过期', icon: 'xCircle' },
  };
  const c = map[status] || map.permanent;
  return `<span class="badge badge-${status}"><span class="dot"></span>${icons[c.icon]}${c.label}</span>`;
}

// ========== 事件绑定 ==========
function bindEvents() {
  // 首页事件
  const searchInput = $('#search-input');
  if (searchInput) {
    let timer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.search = e.target.value.trim(); render(); }, 260);
    });
  }
  const searchClear = $('#search-clear');
  if (searchClear) searchClear.addEventListener('click', () => { state.search = ''; render(); });

  // 统计卡点击筛选
  $$('.stat-card').forEach(card => {
    card.addEventListener('click', () => {
      const f = card.dataset.filter;
      state.expireFilter = f ? (state.expireFilter === f ? null : f) : null;
      render();
    });
  });

  // 分类标签
  $$('.tab[data-cat]').forEach(tab => {
    tab.addEventListener('click', () => {
      state.activeCategory = tab.dataset.cat || null;
      render();
    });
  });

  // 物品卡片
  $$('.item-card').forEach(card => {
    card.addEventListener('click', () => {
      state.view = 'detail';
      state.detailId = card.dataset.item;
      render();
    });
  });

  // FAB
  const btnAdd = $('#btn-add');
  if (btnAdd) btnAdd.addEventListener('click', () => openForm(null));

  // 分类管理
  const btnCatManage = $('#btn-cat-manage');
  if (btnCatManage) btnCatManage.addEventListener('click', () => { state.modal = 'categories'; renderModal(); });


  // 添加到桌面
  const btnInstall = $('#btn-install');
  if (btnInstall) btnInstall.addEventListener('click', showInstallGuide);
  // 导出/导入
  const btnExport = $('#btn-export');
  if (btnExport) btnExport.addEventListener('click', exportData);
  const btnImport = $('#btn-import');
  if (btnImport) btnImport.addEventListener('click', () => $('#json-input').click());

  // 详情页
  const btnBack = $('#btn-back');
  if (btnBack) btnBack.addEventListener('click', () => { state.view = 'home'; state.detailId = null; render(); });
  const btnEdit = $('#btn-edit');
  if (btnEdit) btnEdit.addEventListener('click', () => {
    const item = state.items.find(i => i.id === state.detailId);
    openForm(item);
  });
  const btnDelete = $('#btn-delete');
  if (btnDelete) btnDelete.addEventListener('click', () => {
    const item = state.items.find(i => i.id === state.detailId);
    if (!item) return;
    if (confirm(`确定删除「${item.name}」吗？删除后不可恢复。`)) {
      state.items = state.items.filter(i => i.id !== item.id);
      saveState();
      toast('success', '已删除');
      state.view = 'home';
      state.detailId = null;
      render();
    }
  });
}

function renderModal() {
  // 移除已有弹窗
  const existing = $('.modal-overlay');
  if (existing) existing.remove();
  if (!state.modal) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = state.modal === 'form' ? renderFormModal() : renderCategoriesModal();
  document.body.appendChild(wrapper.firstElementChild);
  bindModalEvents();
}

function bindModalEvents() {
  const overlay = $('#modal-overlay');
  if (!overlay) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  const closeBtn = $('#modal-close');
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  const cancelBtn = $('#form-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
  const catClose = $('#cat-close');
  if (catClose) catClose.addEventListener('click', closeModal);

  // 图片上传
  const imgUpload = $('#img-upload');
  if (imgUpload) imgUpload.addEventListener('click', () => $('#img-input').click());
  const imgRemove = $('#img-remove');
  if (imgRemove) imgRemove.addEventListener('click', (e) => { e.stopPropagation(); state.formImage = null; renderModal(); });

  // 图片文件处理
  $('#img-input').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('error', '请选择图片文件'); return; }
    if (file.size > 5 * 1024 * 1024) { toast('error', '图片不能超过 5MB'); return; }
    compressImage(file, (dataUrl) => { state.formImage = dataUrl; renderModal(); });
    e.target.value = '';
  };

  // 表单提交
  const submitBtn = $('#form-submit');
  if (submitBtn) submitBtn.addEventListener('click', submitForm);
  // Enter 键快速提交（备注框除外）
  ['f-name', 'f-loc'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitForm(); } });
  });

  // 添加分类
  const addCatBtn = $('#btn-add-cat');
  if (addCatBtn) addCatBtn.addEventListener('click', addCategory);
  const newCatInput = $('#new-cat-name');
  if (newCatInput) newCatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCategory(); });
}

function openForm(item) {
  state.editingItem = item;
  state.formImage = item ? (item.imageUrl || null) : null;
  state.modal = 'form';
  state.submitting = false;
  renderModal();
}

function closeModal() {
  state.modal = null;
  state.editingItem = null;
  state.formImage = null;
  const overlay = $('.modal-overlay');
  if (overlay) overlay.remove();
}

function submitForm() {
  const name = $('#f-name').value.trim();
  const location = $('#f-loc').value.trim();
  const categoryId = $('#f-cat').value;
  const expireDate = $('#f-expire').value || null;
  const note = $('#f-note').value.trim();

  let valid = true;
  $('#err-name').textContent = '';
  $('#err-loc').textContent = '';
  if (!name) { $('#err-name').textContent = '请填写物品名'; valid = false; }
  if (!location) { $('#err-loc').textContent = '请填写存放位置'; valid = false; }
  if (!valid) return;

  state.submitting = true;
  renderModal();

  setTimeout(() => {
    if (state.editingItem) {
      const idx = state.items.findIndex(i => i.id === state.editingItem.id);
      if (idx >= 0) {
        state.items[idx] = { ...state.items[idx], name, location, categoryId, expireDate, note, imageUrl: state.formImage, updatedAt: new Date().toISOString() };
      }
      toast('success', '已保存修改');
    } else {
      state.items.unshift({
        id: uid(), name, location, categoryId, expireDate, note,
        imageUrl: state.formImage,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      });
      toast('success', '记下啦，东西的位置已收好');
    }
    saveState();
    state.submitting = false;
    closeModal();
    render();
  }, 300);
}

function addCategory() {
  const input = $('#new-cat-name');
  const name = input.value.trim();
  const err = $('#err-cat');
  err.textContent = '';
  if (!name) { err.textContent = '请输入分类名'; return; }
  if (state.categories.some(c => c.name === name)) { err.textContent = `分类「${name}」已存在`; return; }
  state.categories.push({ id: uid(), name, isPreset: false });
  saveState();
  toast('success', `已新增分类「${name}」`);
  input.value = '';
  renderModal();
}

// 图片压缩（避免 localStorage 爆掉）
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * (maxW / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { toast('error', '图片读取失败'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 添加到桌面引导
function showInstallGuide() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  let steps = '';
  if (isIOS) {
    steps = '<ol style="text-align:left;font-size:.875rem;line-height:1.8;color:var(--ink);padding-left:1.25rem;margin:.5rem 0"><li>点击底部中间的 <b>分享</b> 按钮（方框带向上箭头）</li><li>向下滑动，点击 <b>添加到主屏幕</b></li><li>点击右上角 <b>添加</b>，桌面就出现西高地图标啦</li></ol>';
  } else if (isAndroid) {
    steps = '<ol style="text-align:left;font-size:.875rem;line-height:1.8;color:var(--ink);padding-left:1.25rem;margin:.5rem 0"><li>点击浏览器右上角 <b>⋮</b> 菜单</li><li>点击 <b>添加到主屏幕</b> 或 <b>安装应用</b></li><li>确认后桌面出现西高地图标，点开即用</li></ol>';
  } else {
    steps = '<p style="font-size:.875rem;color:var(--ink-soft);margin:.5rem 0">请用手机浏览器打开本页面，再按对应系统步骤添加到桌面。</p>';
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'install-overlay';
  overlay.innerHTML = '<div class="modal" style="max-width:22rem;text-align:center"><button class="modal-close" id="install-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><div style="width:4rem;height:4rem;margin:0 auto .75rem;border-radius:50%;background:var(--wood-lighter);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="var(--wood-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.75rem;height:1.75rem"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg></div><h2 style="font-family:var(--font-title);font-size:1.25rem;font-weight:700;margin-bottom:.25rem">添加到桌面</h2><p style="font-size:.8125rem;color:var(--ink-soft);margin-bottom:.75rem">把「东西呢」装到手机桌面，点开就用</p>' + steps + '<button class="btn btn-primary" id="install-ok" style="width:100%;margin-top:1rem">知道了</button></div>';
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  $('#install-close').addEventListener('click', close);
  $('#install-ok').addEventListener('click', close);
}

// 导出/导入
function exportData() {
  const data = { categories: state.categories, items: state.items, exportedAt: new Date().toISOString(), app: '东西呢' };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `东西呢-备份-${todayShanghai()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('success', '备份已导出');
}

$('#json-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.categories || !data.items) throw new Error('格式不正确');
      if (!confirm(`导入将覆盖当前数据（${data.items.length} 件物品、${data.categories.length} 个分类），确定继续？`)) return;
      state.categories = data.categories;
      state.items = data.items;
      saveState();
      toast('success', '导入成功');
      render();
    } catch (err) {
      toast('error', '导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== 启动 ==========
loadState();
render();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
