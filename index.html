<style>
/* ========== 主题变量（暖木手账风） ========== */
:root {
  --paper: hsl(38, 40%, 97%);
  --paper-deep: hsl(36, 38%, 94%);
  --wood: hsl(28, 85%, 55%);
  --wood-light: hsl(28, 90%, 93%);
  --wood-lighter: hsl(30, 95%, 96%);
  --wood-dark: hsl(28, 68%, 42%);
  --ink: hsl(24, 14%, 24%);
  --ink-soft: hsl(26, 10%, 44%);
  --ink-faint: hsl(28, 10%, 62%);
  --amber: hsl(35, 90%, 58%);
  --terracotta: hsl(8, 75%, 55%);
  --moss: hsl(145, 45%, 52%);
  --white: #ffffff;
  --radius: 14px;
  --radius-lg: 18px;
  --shadow-card: 0 1px 2px hsla(28,30%,70%,.18), 0 4px 14px hsla(28,30%,60%,.10);
  --shadow-hover: 0 2px 6px hsla(28,30%,60%,.22), 0 10px 24px hsla(28,30%,50%,.14);
  --shadow-fab: 0 4px 14px hsla(28,70%,45%,.38);
  --font-title: "LXGW WenKai", "Kaiti SC", "STKaiti", KaiTi, "楷体", serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  background-image: radial-gradient(hsla(28,60%,82%,.10) 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}

/* ========== 布局 ========== */
.app { max-width: 48rem; margin: 0 auto; padding: 0 1rem 6rem; }

/* ========== 头部 ========== */
.header { display: flex; align-items: center; justify-content: space-between; padding-top: 1.5rem; }
.header-left { display: flex; align-items: center; gap: .625rem; }
.logo {
  width: 2.75rem; height: 2.75rem; border-radius: 50%;
  background: var(--wood-lighter); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px hsla(28,60%,55%,.2);
  overflow: hidden;
}
.logo svg { width: 2.25rem; height: 2.25rem; }
.header h1 { font-family: var(--font-title); font-size: 1.5rem; font-weight: 700; line-height: 1; }
.header p { font-size: .75rem; color: var(--ink-faint); margin-top: .25rem; }
.header-actions { display: flex; gap: .5rem; }
.icon-btn {
  width: 2.25rem; height: 2.25rem; border-radius: 12px; border: 1px solid hsla(28,85%,55%,.25);
  background: rgba(255,255,255,.7); color: var(--ink-soft); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.icon-btn:hover { background: var(--wood-lighter); color: var(--ink); }
.icon-btn svg { width: 1rem; height: 1rem; }

/* ========== 搜索框 ========== */
.search-wrap { margin-top: 1.5rem; }
.search-box {
  display: flex; align-items: center; gap: .5rem;
  width: 100%; border-radius: 16px; background: rgba(255,255,255,.9);
  border: 2px solid transparent; box-shadow: var(--shadow-card);
  padding: .625rem 1rem; transition: all .2s;
}
.search-box:focus-within { border-color: hsla(28,85%,55%,.6); }
.search-box svg { width: 1.25rem; height: 1.25rem; color: var(--wood-dark); flex-shrink: 0; }
.search-box input {
  flex: 1; border: none; background: transparent; font-size: 1rem; color: var(--ink);
  font-family: var(--font-body); outline: none; height: 2.25rem;
}
.search-box input::placeholder { color: var(--ink-faint); }
.search-clear {
  border: none; background: transparent; cursor: pointer; color: var(--ink-faint);
  padding: .25rem; border-radius: 50%; display: flex;
}
.search-clear:hover { background: var(--wood-lighter); color: var(--ink); }

/* ========== 统计卡 ========== */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .625rem; margin-top: 1rem; }
.stat-card {
  background: var(--white); border-radius: var(--radius); padding: .75rem;
  box-shadow: var(--shadow-card); cursor: pointer; transition: all .15s;
  position: relative; overflow: hidden;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-card.active { outline: 2px solid hsla(28,85%,55%,.5); }
.stat-icon {
  display: inline-flex; align-items: center; justify-content: center;

// ========== 状态管理 ==========
const STORAGE_KEY = 'my-stuff-app-v1';
const PRESET_CATEGORIES = ['证件票据', '电子产品', '药品健康', '衣物配饰', '厨房餐具', '工具维修', '美妆个护', '其他'];

let state = {
  categories: [],
  items: [],
  view: 'home', // 'home' | 'detail'
  detailId: null,
  search: '',
  activeCategory: null,
  expireFilter: null,
  modal: null, // 'form' | 'categories' | null
  editingItem: null,
  formImage: null,
  submitting: false,
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.categories = parsed.categories || [];
      state.items = parsed.items || [];
    }
  } catch (e) { console.warn('加载数据失败', e); }
  // 首次访问初始化预置分类
  if (state.categories.length === 0) {
    state.categories = PRESET_CATEGORIES.map(name => ({ id: uid(), name, isPreset: true }));
    saveState();
  }
}
let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories: state.categories, items: state.items }));
    } catch (e) {
      toast('error', '保存失败：存储空间可能已满（图片过多）');
    }
  }, 200);
}

// ========== Toast ==========
function toast(type, message) {
  let container = $('.toast-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  const iconName = type === 'success' ? 'checkCircle' : type === 'error' ? 'xCircle' : 'clock';
  el.innerHTML = `${icons[iconName]}<span>${message}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2400);
}

// ========== 渲染 ==========
function render() {
  const app = $('#app');
  if (state.view === 'detail') {
    app.innerHTML = renderDetail();
  } else {
    app.innerHTML = renderHome();
  }
  bindEvents();
}

function filteredItems() {
  let list = [...state.items];
  if (state.search) {
    const kw = state.search.toLowerCase();
    list = list.filter(i =>
      i.name.toLowerCase().includes(kw) ||
      i.location.toLowerCase().includes(kw) ||
      (i.note && i.note.toLowerCase().includes(kw))
    );
  }
  if (state.activeCategory) {
    list = list.filter(i => i.categoryId === state.activeCategory);
  }
  if (state.expireFilter) {
    list = list.filter(i => computeExpireStatus(i.expireDate) === state.expireFilter);
  }
  // 创建时间降序
  list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  return list;
}

function categoryItemCount(catId) {
  return state.items.filter(i => i.categoryId === catId).length;
}

function renderHome() {
  const items = filteredItems();
  const total = state.items.length;
  const expiring = state.items.filter(i => computeExpireStatus(i.expireDate) === 'expiring').length;
  const expired = state.items.filter(i => computeExpireStatus(i.expireDate) === 'expired').length;

  const stats = [
    { label: '物品总数', value: total, icon: 'boxes', color: 'var(--wood-dark)', bg: 'hsla(28,85%,55%,.12)', filter: null },
    { label: '即将到期', value: expiring, icon: 'clock', color: 'var(--amber)', bg: 'hsla(35,90%,58%,.12)', filter: 'expiring' },
    { label: '已过期', value: expired, icon: 'xCircle', color: 'var(--terracotta)', bg: 'hsla(8,75%,55%,.12)', filter: 'expired' },
    { label: '分类数', value: state.categories.length, icon: 'folder', color: 'var(--moss)', bg: 'hsla(145,45%,52%,.12)', filter: null },
  ];

  return `
    <header class="header">
      <div class="header-left">
        <div class="logo">${icons.westie}</div>
        <div>
          <h1>东西呢</h1>
          <p>找得到 · 记得住 · 不临期</p>
        </div>
      </div>
      <div class="header-actions"><button class="icon-btn" id="btn-install" title="添加到桌面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-export" title="导出备份">${icons.download}</button>
        <button class="icon-btn" id="btn-import" title="导入备份">${icons.upload}</button>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        ${icons.search}
        <input type="text" id="search-input" placeholder="搜物品名、位置或备注…" value="${state.search}" enterkeyhint="search">
        ${state.search ? `<button class="search-clear" id="search-clear">${icons.x}</button>` : ''}
      </div>
    </div>

    <div class="stats">
      ${stats.map(s => `
        <div class="stat-card ${state.expireFilter === s.filter && s.filter ? 'active' : ''}" data-filter="${s.filter || ''}">
          <div class="stat-icon" style="color:${s.color};background:${s.bg}">${icons[s.icon]}</div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      `).join('')}
    </div>

    <div class="tabs-wrap">
      <div class="tabs">
        <button class="tab ${state.activeCategory === null ? 'active' : ''}" data-cat="">全部 <span class="count">${total}</span></button>
        ${state.categories.map(c => `
          <button class="tab ${state.activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">${c.name} <span class="count">${categoryItemCount(c.id)}</span></button>
        `).join('')}
        <button class="tab-manage" id="btn-cat-manage">＋ 管理分类</button>
      </div>
    </div>

    ${items.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">${icons.westie}</div>
        <h3>${state.search || state.expireFilter ? '没有符合条件的物品' : '还没有物品'}</h3>
        <p>${state.search || state.expireFilter ? '换个关键词，或清掉筛选再看看' : '点击右下角按钮，记下第一件东西的位置吧'}</p>
      </div>
    ` : `
      <div class="grid">
        ${items.map(item => renderItemCard(item)).join('')}
      </div>
    `}

    <button class="fab" id="btn-add" title="新增物品">${icons.plus}</button>
  `;
}

function renderItemCard(item) {
  const cat = state.categories.find(c => c.id === item.categoryId);
  const status = computeExpireStatus(item.expireDate);
  return `
    <button class="item-card" data-item="${item.id}">
      <div class="item-img">
        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" loading="lazy">` : `<span class="placeholder">${item.name.charAt(0)}</span>`}
        <span class="item-badge">${renderBadge(status)}</span>
      </div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-loc">${icons.mapPin}<span>${item.location}</span></div>
        <div class="item-meta">
          <span class="item-cat">${cat ? cat.name : '未分类'}</span>
          ${item.expireDate ? `<span class="item-date">${item.expireDate}</span>` : ''}
        </div>
      </div>
    </button>
  `;
}

function renderBadge(status) {
  const map = {
    permanent: { label: '长期有效', icon: 'infinity' },
    valid: { label: '有效', icon: 'checkCircle' },
    expiring: { label: '即将到期', icon: 'clock' },
    expired: { label: '已过期', icon: 'xCircle' },
  };
  const c = map[status] || map.permanent;
  return `<span class="badge badge-${status}"><span class="dot"></span>${icons[c.icon]}${c.label}</span>`;
}

function renderDetail() {
  const item = state.items.find(i => i.id === state.detailId);
  if (!item) {
    return `<div class="empty"><div class="empty-icon">${icons.westie}</div><h3>找不到这件东西</h3><button class="btn btn-outline" id="btn-back">返回首页</button></div>`;
  }
  const cat = state.categories.find(c => c.id === item.categoryId);
  const status = computeExpireStatus(item.expireDate);

  return `
    <button class="detail-back" id="btn-back">${icons.arrowLeft} 返回</button>
    ${item.imageUrl ? `<img class="detail-img" src="${item.imageUrl}" alt="${item.name}">` : ''}
    <div class="detail-loc">
      ${icons.mapPin}
      <div>
        <div class="detail-loc-label">存放在</div>
        <div class="detail-loc-value">${item.location}</div>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-title-row">
        <h2 class="detail-title">${item.name}</h2>
        ${renderBadge(status)}
      </div>
      <div class="detail-meta">
        <span class="detail-cat">${cat ? cat.name : '未分类'}</span>
        ${item.expireDate ? `<span class="detail-date">${icons.calendar} ${item.expireDate}</span>` : ''}
        <span class="detail-date">${icons.clock} 记录于 ${formatDate(item.createdAt)}</span>
      </div>
      ${item.note ? `
        <div class="detail-note">
          <div class="detail-note-label">备注</div>
          <div class="detail-note-text">${item.note}</div>
        </div>
      ` : ''}
    </div>
    <div class="detail-actions">
      <button class="btn btn-secondary" id="btn-edit">${icons.pencil} 编辑</button>
      <button class="btn btn-danger" id="btn-delete">${icons.trash} 删除</button>
    </div>
  `;
}

function renderFormModal() {
  const editing = state.editingItem;
  const values = editing || { name: '', location: '', categoryId: state.categories[0]?.id || '', expireDate: '', note: '' };
  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <button class="modal-close" id="modal-close">${icons.x}</button>
        <h2>${editing ? '编辑物品' : '记一件东西'}</h2>
        <p class="desc">${editing ? '修改档案信息，位置写清楚，下次不翻箱倒柜。' : '存放位置写具体一点，找起来才快。'}</p>

        <div class="form-group">
          <div class="img-upload" id="img-upload">
            ${state.formImage ? `<img src="${state.formImage}" alt="预览"><button class="img-remove" id="img-remove">${icons.trash}</button>` : `${icons.image}<span>添加照片</span><small>方便一眼认出它</small>`}
          </div>
        </div>

        <div class="form-group">
          <label for="f-name">物品名 *</label>
          <input type="text" id="f-name" value="${values.name}" placeholder="比如：家里的备用钥匙" maxlength="128">
          <div class="form-error" id="err-name"></div>
        </div>

        <div class="form-group">
          <label for="f-loc">存放位置 *</label>
          <input type="text" id="f-loc" value="${values.location}" placeholder="比如：玄关抽屉第二层" maxlength="128" style="border-color:hsla(28,85%,55%,.5);background:hsla(30,95%,96%,.5)">
          <div class="form-error" id="err-loc"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-cat">分类</label>
            <select id="f-cat">
              ${state.categories.map(c => `<option value="${c.id}" ${values.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label for="f-expire">到期日期</label>
            <input type="date" id="f-expire" value="${values.expireDate || ''}">
            <div class="form-hint">药品、食物等临期物品建议填写</div>
          </div>
        </div>

        <div class="form-group">
          <label for="f-note">备注</label>
          <textarea id="f-note" placeholder="补充细节：品牌、型号、颜色、收纳盒里的第几格…" maxlength="2000">${values.note || ''}</textarea>
        </div>

        <div class="btn-group">
          <button class="btn btn-outline" id="form-cancel">取消</button>
          <button class="btn btn-primary" id="form-submit" ${state.submitting ? 'disabled' : ''}>${state.submitting ? '保存中…' : (editing ? '保存修改' : '记下它')}</button>
        </div>
      </div>
    </div>
  `;
}

function renderCategoriesModal() {
  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <button class="modal-close" id="modal-close">${icons.x}</button>
        <h2>管理分类</h2>
        <p class="desc">预置分类自动生成，可按需新增自定义分类。</p>
        <div class="cat-list">
          ${state.categories.map(c => `
            <span class="cat-chip">
              ${c.name}
              <span class="count">${categoryItemCount(c.id)}</span>
              ${c.isPreset ? '<span class="preset">预置</span>' : ''}
            </span>
          `).join('')}
        </div>
        <div class="cat-add-row">
          <input type="text" id="new-cat-name" placeholder="比如：运动装备" maxlength="64">
          <button class="btn btn-primary btn-sm" id="btn-add-cat">${icons.plus} 添加</button>
        </div>
        <div class="form-error" id="err-cat"></div>
        <div class="btn-group">
          <button class="btn btn-outline" id="cat-close">完成</button>
        </div>
      </div>
    </div>
  `;
}

// ========== 事件绑定 ==========
function bindEvents() {
  // 首页事件
  const searchInput = $('#search-input');
  if (searchInput) {
    let timer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.search = e.target.value.trim(); render(); }, 260);
    });
  }
  const searchClear = $('#search-clear');
  if (searchClear) searchClear.addEventListener('click', () => { state.search = ''; render(); });

  // 统计卡点击筛选
  $$('.stat-card').forEach(card => {
    card.addEventListener('click', () => {
      const f = card.dataset.filter;
      state.expireFilter = f ? (state.expireFilter === f ? null : f) : null;
      render();
    });
  });

  // 分类标签
  $$('.tab[data-cat]').forEach(tab => {
    tab.addEventListener('click', () => {
      state.activeCategory = tab.dataset.cat || null;
      render();
    });
  });

  // 物品卡片
  $$('.item-card').forEach(card => {
    card.addEventListener('click', () => {
      state.view = 'detail';
      state.detailId = card.dataset.item;
      render();
    });
  });

  // FAB
  const btnAdd = $('#btn-add');
  if (btnAdd) btnAdd.addEventListener('click', () => openForm(null));

  // 分类管理
  const btnCatManage = $('#btn-cat-manage');
  if (btnCatManage) btnCatManage.addEventListener('click', () => { state.modal = 'categories'; renderModal(); });


  // 添加到桌面
  const btnInstall = $('#btn-install');
  if (btnInstall) btnInstall.addEventListener('click', showInstallGuide);
  // 导出/导入
  const btnExport = $('#btn-export');
  if (btnExport) btnExport.addEventListener('click', exportData);
  const btnImport = $('#btn-import');
  if (btnImport) btnImport.addEventListener('click', () => $('#json-input').click());

  // 详情页
  const btnBack = $('#btn-back');
  if (btnBack) btnBack.addEventListener('click', () => { state.view = 'home'; state.detailId = null; render(); });
  const btnEdit = $('#btn-edit');
  if (btnEdit) btnEdit.addEventListener('click', () => {
    const item = state.items.find(i => i.id === state.detailId);
    openForm(item);
  });
  const btnDelete = $('#btn-delete');
  if (btnDelete) btnDelete.addEventListener('click', () => {
    const item = state.items.find(i => i.id === state.detailId);
    if (!item) return;
    if (confirm(`确定删除「${item.name}」吗？删除后不可恢复。`)) {
      state.items = state.items.filter(i => i.id !== item.id);
      saveState();
      toast('success', '已删除');
      state.view = 'home';
      state.detailId = null;
      render();
    }
  });
}

function renderModal() {
  // 移除已有弹窗
  const existing = $('.modal-overlay');
  if (existing) existing.remove();
  if (!state.modal) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = state.modal === 'form' ? renderFormModal() : renderCategoriesModal();
  document.body.appendChild(wrapper.firstElementChild);
  bindModalEvents();
}

function bindModalEvents() {
  const overlay = $('#modal-overlay');
  if (!overlay) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  const closeBtn = $('#modal-close');
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  const cancelBtn = $('#form-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
  const catClose = $('#cat-close');
  if (catClose) catClose.addEventListener('click', closeModal);

  // 图片上传
  const imgUpload = $('#img-upload');
  if (imgUpload) imgUpload.addEventListener('click', () => $('#img-input').click());
  const imgRemove = $('#img-remove');
  if (imgRemove) imgRemove.addEventListener('click', (e) => { e.stopPropagation(); state.formImage = null; renderModal(); });

  // 图片文件处理
  $('#img-input').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('error', '请选择图片文件'); return; }
    if (file.size > 5 * 1024 * 1024) { toast('error', '图片不能超过 5MB'); return; }
    compressImage(file, (dataUrl) => { state.formImage = dataUrl; renderModal(); });
    e.target.value = '';
  };

  // 表单提交
  const submitBtn = $('#form-submit');
  if (submitBtn) submitBtn.addEventListener('click', submitForm);
  // Enter 键快速提交（备注框除外）
  ['f-name', 'f-loc'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitForm(); } });
  });

  // 添加分类
  const addCatBtn = $('#btn-add-cat');
  if (addCatBtn) addCatBtn.addEventListener('click', addCategory);
  const newCatInput = $('#new-cat-name');
  if (newCatInput) newCatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCategory(); });
}

function openForm(item) {
  state.editingItem = item;
  state.formImage = item ? (item.imageUrl || null) : null;
  state.modal = 'form';
  state.submitting = false;
  renderModal();
}

function closeModal() {
  state.modal = null;
  state.editingItem = null;
  state.formImage = null;
  const overlay = $('.modal-overlay');
  if (overlay) overlay.remove();
}

function submitForm() {
  const name = $('#f-name').value.trim();
  const location = $('#f-loc').value.trim();
  const categoryId = $('#f-cat').value;
  const expireDate = $('#f-expire').value || null;
  const note = $('#f-note').value.trim();

  let valid = true;
  $('#err-name').textContent = '';
  $('#err-loc').textContent = '';
  if (!name) { $('#err-name').textContent = '请填写物品名'; valid = false; }
  if (!location) { $('#err-loc').textContent = '请填写存放位置'; valid = false; }
  if (!valid) return;

  state.submitting = true;
  renderModal();

  setTimeout(() => {
    if (state.editingItem) {
      const idx = state.items.findIndex(i => i.id === state.editingItem.id);
      if (idx >= 0) {
        state.items[idx] = { ...state.items[idx], name, location, categoryId, expireDate, note, imageUrl: state.formImage, updatedAt: new Date().toISOString() };
      }
      toast('success', '已保存修改');
    } else {
      state.items.unshift({
        id: uid(), name, location, categoryId, expireDate, note,
        imageUrl: state.formImage,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      });
      toast('success', '记下啦，东西的位置已收好');
    }
    saveState();
    state.submitting = false;
    closeModal();
    render();
  }, 300);
}

function addCategory() {
  const input = $('#new-cat-name');
  const name = input.value.trim();
  const err = $('#err-cat');
  err.textContent = '';
  if (!name) { err.textContent = '请输入分类名'; return; }
  if (state.categories.some(c => c.name === name)) { err.textContent = `分类「${name}」已存在`; return; }
  state.categories.push({ id: uid(), name, isPreset: false });
  saveState();
  toast('success', `已新增分类「${name}」`);
  input.value = '';
  renderModal();
}

// 图片压缩（避免 localStorage 爆掉）
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * (maxW / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { toast('error', '图片读取失败'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 导出/导入
function exportData() {
  const data = { categories: state.categories, items: state.items, exportedAt: new Date().toISOString(), app: '东西呢' };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `东西呢-备份-${todayShanghai()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('success', '备份已导出');
}

$('#json-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.categories || !data.items) throw new Error('格式不正确');
      if (!confirm(`导入将覆盖当前数据（${data.items.length} 件物品、${data.categories.length} 个分类），确定继续？`)) return;
      state.categories = data.categories;
      state.items = data.items;
      saveState();
      toast('success', '导入成功');
      render();
    } catch (err) {
      toast('error', '导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== 启动 ==========
loadState();
render();
</script>
